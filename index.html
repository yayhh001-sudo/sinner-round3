<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SINNER | FINAL ROUND</title><style>
:root{color-scheme:dark;font-family:system-ui,'Malgun Gothic',sans-serif}*{box-sizing:border-box}body{margin:0;background:#09080b;color:#f2e7d5}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px max(18px,4vw);background:#141013;border-bottom:1px solid #765834}.logo{font-family:Georgia,serif;letter-spacing:.24em;color:#d7b57b;font-size:25px}.muted{color:#bda98e;font-size:13px}main{max-width:1250px;margin:auto;padding:20px}h1{font-size:23px;margin:0 0 8px}.stage{position:relative;aspect-ratio:1672/941;overflow:hidden;border:1px solid #8c693e;border-radius:15px;background:#141015;touch-action:pan-y;user-select:none}.scene{width:100%;height:100%;object-fit:contain;object-position:center;display:block;pointer-events:none}.shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.5),transparent 40%);pointer-events:none}.hotspot{position:absolute;transform:translate(-50%,-50%);border:1px solid #efcb83;border-radius:999px;background:rgba(19,12,11,.87);color:#ffe2a4;padding:9px 13px;cursor:pointer;box-shadow:0 0 0 6px #e7b86522;font-size:14px;font-weight:700;white-space:nowrap}.hotspot:hover,.hotspot:focus{background:#75502a}.hud{position:absolute;left:15px;top:15px;background:#110d10d9;border:1px solid #8a683c;padding:9px 13px;border-radius:9px;color:#f0c783;font-size:13px}.nav{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0}.nav button,.action{border:1px solid #97754b;background:#21181a;color:#f8e3bc;border-radius:10px;padding:12px 17px;cursor:pointer;font-weight:700}.nav button:hover,.action:hover{background:#48301e}.columns{display:grid;grid-template-columns:1fr 320px;gap:15px}.panel{border:1px solid #725535;border-radius:12px;background:#171216;padding:17px}.evidence{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot{padding:12px 6px;border:1px dashed #866847;border-radius:8px;text-align:center;font-size:12px;color:#cdb994}.slot.found{border-style:solid;background:#31241a;color:#f1d3a0}input{font-size:23px;letter-spacing:.25em;background:#09080b;color:#fff;border:1px solid #997349;padding:12px;border-radius:8px;width:100%;text-align:center;margin:10px 0}dialog{background:#171216;color:#f4e9d7;border:1px solid #ac8451;border-radius:16px;max-width:min(680px,94vw);max-height:90vh;overflow:auto;padding:22px}dialog::backdrop{background:#000c}dialog img{display:block;width:100%;max-height:58vh;object-fit:contain;border-radius:9px;margin:10px auto}dialog h2{margin-top:0}.close{float:right;background:none;border:1px solid #997349;color:#eac78c;border-radius:7px;padding:6px 10px;cursor:pointer}.note{white-space:pre-line;line-height:1.7}.help{font-size:13px;color:#bda98e;line-height:1.6}@media(max-width:700px){.columns{grid-template-columns:1fr}.stage{aspect-ratio:1672/941}.logo{font-size:18px}.hotspot{font-size:11px;padding:7px}.evidence{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><div class="logo">♛ SINNER</div><div class="muted">HOST CLUB · ROUND 3</div></header><main><h1>지배인의 사무실</h1><p class="muted">화면을 드래그하거나 ◀ ▶ 버튼·키보드 방향키로 네 방향의 독립된 사진을 전환하세요. 사진 비율은 고정됩니다. 빛나는 표식을 클릭해 조사합니다.</p><div class="stage" id="stage"><img class="scene" id="scene" src="assets/front.jpg" alt="SINNER 지배인 사무실"><div class="shade"></div><div class="hud" id="direction">정면 · 0°</div><div id="spots"></div></div><div class="nav"><button id="prev">◀ 왼쪽</button><button id="front">정면 보기</button><button id="next">오른쪽 ▶</button></div><div class="columns"><section class="panel"><b>수집한 증거 <span id="count">0/4</span></b><div class="evidence" id="evidence" style="margin-top:12px"></div><p class="help">기존 1라운드 아이폰에서 발견한 대현마트 영수증을 다시 확인해도 됩니다. 증거를 클릭하면 다시 볼 수 있습니다.</p></section><section class="panel"><b>🔐 마지막 자물쇠</b><input id="code" type="text" inputmode="numeric" maxlength="4" placeholder="••••" aria-label="4자리 비밀번호"><button class="action" id="unlock" style="width:100%">잠금 해제</button><p id="result" class="help" aria-live="polite">네 자리 비밀번호를 입력하세요.</p></section></div></main><dialog id="modal"><button class="close" id="close">닫기 ✕</button><h2 id="modalTitle"></h2><div id="modalBody"></div><div id="modalActions"></div></dialog><script>
// Four separately created scene images use a unified 1672×941 canvas; no stretching or cropped enlargements.
// Hotspots are positioned against the visible objects in each actual image.
const views=[
{name:'정면',img:'front.jpg',spots:[['책상 조사',50,58,'desk']]},
{name:'오른쪽',img:'right.jpg',spots:[['출입문',89,47,'door'],['책상 조사',20,67,'desk']]},
{name:'뒤쪽',img:'rear.jpg',spots:[['응접실 조사',52,60,'lounge']]},
{name:'왼쪽',img:'left.jpg',spots:[['휴지통 조사',33,73,'trash'],['서랍장 조사',53,67,'drawer'],['책상 조사',91,72,'desk']]}
];
const evidenceData={trash:{title:'휴지통 — 구겨진 메모',img:'trash_note.png'},drawer:{title:'서랍 — 수상한 사진',img:'drawer.png'},back:{title:'사진 뒷면 — 암호 규칙',img:'photo_back.png'},receipt:{title:'대현마트 영수증',img:'mart_receipt.png'}};
let view=0;const found=new Set();const stage=document.getElementById('stage'),scene=document.getElementById('scene'),spots=document.getElementById('spots'),modal=document.getElementById('modal');
function render(){const v=views[view];scene.src='assets/'+v.img;document.getElementById('direction').textContent=v.name+' · '+(['0°','90°','180°','270°'][view]);spots.replaceChildren();for(const [label,x,y,id] of v.spots){const b=document.createElement('button');b.type='button';b.className='hotspot';b.textContent='⌕ '+label;b.style.left=x+'%';b.style.top=y+'%';b.onclick=()=>inspect(id);spots.append(b)}}
function turn(d){view=(view+d+4)%4;render()}document.getElementById('prev').onclick=()=>turn(-1);document.getElementById('next').onclick=()=>turn(1);document.getElementById('front').onclick=()=>{view=0;render()};document.addEventListener('keydown',e=>{if(modal.open || document.activeElement?.tagName==='INPUT')return;if(e.key==='ArrowLeft'){e.preventDefault();turn(-1)}else if(e.key==='ArrowRight'){e.preventDefault();turn(1)}});let startX=null;stage.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;startX=e.clientX});stage.addEventListener('pointerup',e=>{if(startX===null)return;const dx=e.clientX-startX;startX=null;if(Math.abs(dx)>50)turn(dx<0?1:-1)});
function show(title,body,buttons=[]){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').replaceChildren();document.getElementById('modalActions').replaceChildren();if(typeof body==='string'){const p=document.createElement('p');p.className='note';p.textContent=body;document.getElementById('modalBody').append(p)}else document.getElementById('modalBody').append(body);for(const [label,fn] of buttons){const b=document.createElement('button');b.className='action';b.textContent=label;b.onclick=fn;document.getElementById('modalActions').append(b)}modal.showModal()}
function inspect(id){if(id==='lounge'){show('응접 공간','소파와 테이블을 조사했지만 새로운 증거는 없다. 다른 방향을 살펴보자.');return}if(id==='desk'){show('책상 위 서류','영수증과 관련된 기록을 확인했다. 이미 조사한 지배인의 아이폰에 있던 대현마트 영수증을 다시 떠올려 보자.',[['영수증 다시 보기',()=>inspect('receipt')]]);return}if(id==='door'){show('출입문','문은 잠겨 있다. 대표를 구출하려면 마지막 자물쇠를 풀어야 한다.');return}const data=evidenceData[id];found.add(id);updateEvidence();const img=document.createElement('img');img.src='assets/'+data.img;img.alt=data.title;show(data.title,img,id==='drawer'?[['사진 뒤집기',()=>inspect('back')]]:id==='back'?[['사진 앞면 보기',()=>inspect('drawer')]]:[])}
function updateEvidence(){document.getElementById('count').textContent=found.size+'/4';const wrap=document.getElementById('evidence');wrap.replaceChildren();for(const [id,data] of Object.entries(evidenceData)){const b=document.createElement('button');b.className='slot '+(found.has(id)?'found':'');b.textContent=found.has(id)?data.title:'? 미발견';b.disabled=!found.has(id);b.onclick=()=>inspect(id);wrap.append(b)}}document.getElementById('close').onclick=()=>modal.close();document.getElementById('unlock').onclick=()=>{const c=document.getElementById('code').value.trim();if(c==='8741'){document.getElementById('result').textContent='🔓 잠금 해제 성공!';show('🎉 MISSION COMPLETE','철컥. 자물쇠가 열렸다.\n대표: “드디어 왔구나…!”\nSINNER HOST CLUB — 대표 구출 성공.')}else document.getElementById('result').textContent=c.length!==4?'네 자리 숫자를 입력하세요.':'❌ 비밀번호가 일치하지 않습니다.'};render();updateEvidence();
</script></body></html>
